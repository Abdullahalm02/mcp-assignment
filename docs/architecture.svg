<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Personal Productivity MCP server architecture</title>
<desc>Claude Desktop connects over stdio to the MCP server process, which contains a Tools and prompt region and a Security layer region. The server reads a secret from a .env file and writes to a local JSON data store.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  text { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #444441; stroke-width: 1.5; }
</style>

<rect width="680" height="500" fill="#ffffff"/>

<!-- Claude Desktop client -->
<g>
  <rect x="190" y="50" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="74" text-anchor="middle">Claude Desktop</text>
  <text class="ts" x="340" y="92" text-anchor="middle">MCP client</text>
</g>

<line x1="340" y1="106" x2="340" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="136" text-anchor="start">JSON-RPC / stdio</text>

<!-- Outer container: server process -->
<g>
  <rect x="90" y="150" width="500" height="210" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="110" y="184" fill="#173404">MCP server process</text>
  <text class="ts" x="110" y="202" fill="#27500A">server.py — stdio transport</text>
</g>

<!-- Region: tools and prompt -->
<g>
  <rect x="115" y="215" width="230" height="115" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="230" y="244" text-anchor="middle" fill="#04342C">Tools &amp; prompt</text>
  <text class="ts" x="230" y="264" text-anchor="middle" fill="#085041">add_task, email_draft</text>
  <text class="ts" x="230" y="282" text-anchor="middle" fill="#085041">prioritize_tasks prompt</text>
</g>

<!-- Region: security layer -->
<g>
  <rect x="365" y="215" width="205" height="115" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="467" y="244" text-anchor="middle" fill="#412402">Security layer</text>
  <text class="ts" x="467" y="264" text-anchor="middle" fill="#633806">Input sanitization</text>
  <text class="ts" x="467" y="282" text-anchor="middle" fill="#633806">Rate limiting: 5/60s</text>
</g>

<!-- .env secret, feeds security layer -->
<g>
  <rect x="60" y="400" width="160" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="140" y="424" text-anchor="middle">.env file</text>
  <text class="ts" x="140" y="442" text-anchor="middle">EMAIL_API_KEY</text>
</g>
<line x1="140" y1="400" x2="140" y2="360" class="arr" marker-end="url(#arrow)"/>

<!-- Local JSON store, fed by tools -->
<g>
  <rect x="420" y="400" width="200" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="520" y="424" text-anchor="middle">Local JSON store</text>
  <text class="ts" x="520" y="442" text-anchor="middle">tasks &amp; emails (JSON)</text>
</g>
<path d="M230 330 L230 380 L520 380 L520 400" fill="none" class="arr" marker-end="url(#arrow)"/>
</svg>
